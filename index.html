<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Connect</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Фоновий декор -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <!-- Вітальне вікно -->
        <div id="welcome-screen" class="glass-card">
            <div class="icon-box pulse">
                <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
            </div>
            <h1 class="title">Привіт!</h1>
            <p class="subtitle">Ти поруч із мережею. Натисни кнопку, щоб отримати швидкий інтернет.</p>
            <button class="main-btn" onclick="showLogin()">Приєднатися</button>
        </div>

        <!-- Форма логіну (прихована спочатку) -->
        <div id="login-screen" class="glass-card hidden slide-up">
            <h2 class="form-title">Авторизація</h2>
            <form id="loginForm">
                <div class="input-field">
                    <input type="text" placeholder="Ваше ім'я" required>
                </div>
                <div class="input-field">
                    <input type="password" placeholder="Код доступу" required>
                </div>
                <button type="submit" class="main-btn">Увійти в мережу</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
